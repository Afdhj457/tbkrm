const STATE={inGame:false,gameAspectRatio:4/3,dead:false,gameStartTime:0,wasRunning:false,cheatUnlocked:false,godMode:false,infStamina:false,currentRegion:0,mazeReady:false,canShowMaze:false,flashlightOn:false,flashlightAnimating:false,flashlightAnimProgress:0,flashlightAnimDirection:0,bootFinished:false};
const DOM={mainMenu:document.getElementById('mainMenu'),startBtn:document.getElementById('startBtn'),gameContainer:document.getElementById('gameContainer'),gameCanvas:document.getElementById('gameCanvas3D'),touchOverlay:document.getElementById('touchOverlay'),tutorialOverlay:document.getElementById('tutorialOverlay'),staticOverlay:document.getElementById('staticOverlay'),videoOverlay:document.getElementById('videoOverlay'),endVideo:document.getElementById('endVideo'),blueScreenOverlay:document.getElementById('blueScreenOverlay'),blueScreenText:document.getElementById('blueScreenText'),staminaBarContainer:document.getElementById('staminaBarContainer'),staminaBarFill:document.getElementById('staminaBarFill'),flashlightBtn:document.getElementById('flashlightBtn'),cheatPanel:document.getElementById('cheatPanel'),menuBgImage:document.getElementById('menuBgImage'),menuStaticOverlay:document.getElementById('menuStaticOverlay'),dvVignetteOverlay:document.getElementById('dvVignetteOverlay'),bootOverlay:document.getElementById('bootOverlay'),bootVideo:document.getElementById('bootVideo'),announcementBtn:document.getElementById('announcementBtn'),announcementOverlay:document.getElementById('announcementOverlay'),announcementCloseBtn:document.getElementById('announcementCloseBtn')};

let exitWalls=[];

let menuMusic=null,levelAudio=null,runAudio=null;
function initAudio(){
menuMusic=new Audio('m.mp3');menuMusic.loop=true;menuMusic.volume=0.5;
levelAudio=new Audio('level0.mp3');levelAudio.loop=true;levelAudio.volume=0.6;
runAudio=new Audio('run.mp3');runAudio.loop=true;runAudio.volume=0.5;
}
function playMenuMusic(){if(menuMusic){menuMusic.currentTime=0;menuMusic.play().catch(()=>{});}}
function stopMenuMusic(){if(menuMusic){menuMusic.pause();menuMusic.currentTime=0;}}
function fadeOutMenuMusic(callback){
if(menuMusic){
const fadeInterval=setInterval(()=>{
if(menuMusic.volume>0.05){menuMusic.volume-=0.05;}
else{clearInterval(fadeInterval);menuMusic.pause();menuMusic.currentTime=0;menuMusic.volume=0.5;if(callback)callback();}
},50);

}

function stopRunAudio(){if(runAudio){runAudio.pause();runAudio.currentTime=0;}}
initAudio();

let audioCtxForBeep=null;
function playBeepSound(){
if(!audioCtxForBeep)audioCtxForBeep=new(window.AudioContext||window.webkitAudioContext)();
const osc=audioCtxForBeep.createOscillator();
const gain=audioCtxForBeep.createGain();
osc.type='sine';osc.frequency.setValueAtTime(800,audioCtxForBeep.currentTime);
gain.gain.setValueAtTime(0.3,audioCtxForBeep.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001,audioCtxForBeep.currentTime+0.3);
osc.connect(gain);gain.connect(audioCtxForBeep.destination);
osc.start(audioCtxForBeep.currentTime);osc.stop(audioCtxForBeep.currentTime+0.3);
}

let menuImageIndex=0;const menuImages=['m1.png','m2.png','m3.png'];
let menuImageTimer=null,menuStaticNoiseTimer=null,nextImagePreloaded=null;

function preloadNextImage(){const nextIndex=(menuImageIndex+1)%menuImages.length;const img=new Image();img.src=menuImages[nextIndex];nextImagePreloaded=img;}
function startMenuBackgroundSlide(){DOM.menuBgImage.src=menuImages[0];menuImageIndex=0;preloadNextImage();if(menuImageTimer)clearInterval(menuImageTimer);menuImageTimer=setInterval(()=>{triggerMenuTransition();},4000);}
function triggerMenuTransition(){if(menuImageTimer)clearInterval(menuImageTimer);showMenuStaticNoise();playStaticNoiseWeb();const checkLoaded=setInterval(()=>{if(nextImagePreloaded&&nextImagePreloaded.complete){clearInterval(checkLoaded);setTimeout(()=>{hideMenuStaticNoise();stopStaticNoiseWeb();menuImageIndex=(menuImageIndex+1)%menuImages.length;DOM.menuBgImage.src=menuImages[menuImageIndex];preloadNextImage();menuImageTimer=setInterval(()=>{triggerMenuTransition();},4000);},200);}},50);}
function showMenuStaticNoise(){DOM.menuStaticOverlay.style.display='block';DOM.menuStaticOverlay.width=window.innerWidth;DOM.menuStaticOverlay.height=window.innerHeight;if(menuStaticNoiseTimer)clearInterval(menuStaticNoiseTimer);menuStaticNoiseTimer=setInterval(()=>{drawStaticNoise(DOM.menuStaticOverlay,1);},50);}
function hideMenuStaticNoise(){DOM.menuStaticOverlay.style.display='none';if(menuStaticNoiseTimer)clearInterval(menuStaticNoiseTimer);menuStaticNoiseTimer=null;}
function drawStaticNoise(canvas,intensity){const ctx=canvas.getContext('2d');const w=canvas.width;const h=canvas.height;const img=ctx.createImageData(w,h);const d=img.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255*intensity;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;}ctx.putImageData(img,0,0);}

let staticNoiseSource=null,staticNoiseGain=null,staticNoiseCtx=null;
function playStaticNoiseWeb(){if(!staticNoiseCtx)staticNoiseCtx=new(window.AudioContext||window.webkitAudioContext)();const bufferSize=staticNoiseCtx.sampleRate*0.5;const buffer=staticNoiseCtx.createBuffer(1,bufferSize,staticNoiseCtx.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<bufferSize;i++){data[i]=Math.random()*2-1;}staticNoiseSource=staticNoiseCtx.createBufferSource();staticNoiseSource.buffer=buffer;staticNoiseSource.loop=true;staticNoiseGain=staticNoiseCtx.createGain();staticNoiseGain.gain.setValueAtTime(0.3,staticNoiseCtx.currentTime);staticNoiseSource.connect(staticNoiseGain);staticNoiseGain.connect(staticNoiseCtx.destination);staticNoiseSource.start(0);}
function stopStaticNoiseWeb(){if(staticNoiseGain){try{staticNoiseGain.disconnect();}catch(e){}if(staticNoiseSource)try{staticNoiseSource.stop();}catch(e){}staticNoiseSource=null;staticNoiseGain=null;}}

DOM.startBtn.addEventListener('click',()=>{DOM.mainMenu.style.opacity='0';stopStaticNoiseWeb();if(menuImageTimer)clearInterval(menuImageTimer);if(menuStaticNoiseTimer)clearInterval(menuStaticNoiseTimer);fadeOutMenuMusic(()=>{DOM.mainMenu.style.display='none';startBackrooms();});});

const REGION0_Y=0,REGION0_CEIL=4,REGION1_Y=10,REGION1_CEIL=14,BASEBOARD_H=0.05,BASEBOARD_COLOR0=0x3d2b05,BASEBOARD_COLOR1=0x222222;

let walls=[],lights=[],loadedGrids=new Map(),loadedBulbs=new Map();
let floorPlanes=[],ceilPlanes=[];
let noteCreated=false,notePos={x:gridSize/2-0.3,z:0.8};

let floorPlanesR1=[],ceilPlanesR1=[],pillarPositionsR1=[];

let mTId=null,mSX=0,mSY=0,mCX=0,mCY=0,lTId=null,lPX=0,lPY=0,aTId=null,aST=0,aSY=0,hasJ=false;

function isInSafeZone(x,z){return Math.abs(x)<=SAFE_DIST&&Math.abs(z)<=SAFE_DIST}

function getJumpHeight(){const p=stamina/maxStamina;if(p>0.6)return 0.12;if(p>0.3)return 0.08;if(p>0.1)return 0.05;return 0.02;}

function updateLightDistance(l,px,pz){const dx=l.x-px,dz=l.z-pz,dist=Math.sqrt(dx*dx+dz*dz);const wasNear=l._isNear;l._isNear=dist<LIGHT_NEAR_DIST;if(l._isNear&&!wasNear){if(l.pl){l.pl.intensity=l.isRed?1.5:5;l.pl.visible=true;}if(l.mesh)l.mesh.visible=true;if(l.housing)l.housing.visible=true;}else if(!l._isNear&&wasNear){if(l.pl){l.pl.intensity=0;l.pl.visible=false;}if(l.mesh)l.mesh.visible=false;if(l.housing)l.housing.visible=false;}}
function updateAllLightDistances(){[...lights,...lightsR1].forEach(l=>updateLightDistance(l,playerX,playerZ));}
function upLightsR0(dt){lights.forEach(l=>{if(l.safe)return;l.fT-=dt;if(l.fT<=0){const fo=Math.random()<0.25;if(l.isRed){if(fo){if(l._isNear)l.pl.intensity=0;l.mesh.material.emissiveIntensity=0;l.pl.color.set(0x440000);l.mesh.material.color.set(0x660000);l.mesh.material.emissive.set(0x330000);l._wasRed=true;}else{if(l._isNear)l.pl.intensity=1.5;l.mesh.material.emissiveIntensity=3;l.pl.color.set(0xff2222);l.mesh.material.color.set(0xff4444);l.mesh.material.emissive.set(0xff0000);l._wasRed=false;}}else{if(fo){if(l._isNear)l.pl.intensity=0;l.mesh.material.emissiveIntensity=0;l.pl.color.set(0x666666);l.mesh.material.color.set(0x888888);l.mesh.material.emissive.set(0x444444);}else{if(l._isNear)l.pl.intensity=5;l.mesh.material.emissiveIntensity=3;l.pl.color.set(0xffeedd);l.mesh.material.color.set(0xffffdd);l.mesh.material.emissive.set(0xffffcc);}}l.fT=0.8+Math.random()*8;}l.rT-=dt;if(l.rT<=0&&!l.isRed&&Math.random()<RED_LIGHT_CHANCE){turnRed(l);l.rT=40+Math.random()*120;}if(l.isRed){l.sT-=dt;if(l.sT<=0){spreadRed(l);l.sT=4+Math.random()*10;}}});}

function getFlashlightAnimOffset(progress){
const t=progress;
const rt=1-t;
if(rt<0.3){const p=rt/0.3;const ease=1-Math.pow(1-p,3);const x=-0.15*ease;const y=-0.5*ease;const z=0.1*ease;return{posOffset:{x,y,z},rotOffset:{x:0.03*ease,y:-0.04*ease,z:0.02*ease}};}
else if(rt<0.5){const p=(rt-0.3)/0.2;const hx=-0.15;const hy=-0.5;const hz=0.1;const hrx=0.03;const hry=-0.04;const hrz=0.02;const shake=Math.sin(p*Math.PI*6)*0.015*(1-p);return{posOffset:{x:hx+shake,y:hy+shake*0.7,z:hz},rotOffset:{x:hrx+shake*0.5,y:hry+shake,z:hrz+shake*0.3}};}
else{const p=(rt-0.5)/0.5;const ease=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const tx=0;const ty=0;const tz=0;const sx=-0.15;const sy=-0.5;const sz=0.1;const x=sx+(tx-sx)*ease;const y=sy+(ty-sy)*ease;const z=sz+(tz-sz)*ease;return{posOffset:{x,y,z},rotOffset:{x:0.03*(1-ease),y:-0.04*(1-ease),z:0.02*(1-ease)}};}
}

function trySpawnRadio(forceNearby){
return;  // 音响已完全禁用
if(radioMesh||radioAudio)return;
if(!scene)return;
let rx,rz;
if(forceNearby){
const angle=Math.random()*Math.PI*2;
const dist=3+Math.random()*5;
rx=playerX+Math.cos(angle)*dist;
rz=playerZ+Math.sin(angle)*dist;
}else{
const angle=Math.random()*Math.PI*2;
const dist=RADIO_MIN_DIST+Math.random()*(RADIO_MAX_DIST-RADIO_MIN_DIST);
rx=playerX+Math.cos(angle)*dist;
rz=playerZ+Math.sin(angle)*dist;
}
const radioY=getCurrentRegionY()+0.2;
radioPosition=new THREE.Vector3(rx,radioY,rz);
const geo=new THREE.BoxGeometry(0.5,0.4,0.3);
const mat=new THREE.MeshStandardMaterial({color:0x333333,roughness:0.8,metalness:0.2});
radioMesh=new THREE.Mesh(geo,mat);
radioMesh.position.copy(radioPosition);
radioMesh.name='radio';
scene.add(radioMesh);
radioAudio=new Audio('yx.mp3');
radioAudio.loop=true;
radioAudio.volume=0;
radioAudio.play().then(()=>{
updateRadioVolume();
}).catch(()=>{});
}

function updateRadioVolume(){
if(!radioAudio||!radioPosition)return;
const dx=playerX-radioPosition.x;
const dz=playerZ-radioPosition.z;
const dist=Math.sqrt(dx*dx+dz*dz);
let vol=0;
if(dist<3){vol=0.8;}
else if(dist<RADIO_DESPAWN_DIST){vol=0.8*(1-(dist-3)/(RADIO_DESPAWN_DIST-3));}
else{vol=0;}
radioAudio.volume=Math.max(0,Math.min(0.8,vol));
}

function updateRadio(dt){
if(!radioMesh||!radioAudio||!radioPosition)return;
updateRadioVolume();
const dx=playerX-radioPosition.x;
const dz=playerZ-radioPosition.z;
const dist=Math.sqrt(dx*dx+dz*dz);
if(dist>RADIO_DESPAWN_DIST){
if(Math.random()<dt*2){removeRadio();}
}
}

function removeRadio(){
if(radioAudio){radioAudio.pause();radioAudio.src='';radioAudio=null;}
if(radioMesh){scene.remove(radioMesh);radioMesh=null;}
radioPosition=null;
}

if(!isMoving&&!isJumping){idleDriftX=Math.sin(idleDriftPhaseX)*idleDriftAmpX;idleDriftY=Math.cos(idleDriftPhaseY)*idleDriftAmpY;}
let jumpShake=0;if(isJumping)jumpShake=0.03;
const totalShake=camShakeAmount+jumpShake;
const shakeX=walkSway+(Math.random()-0.5)*totalShake*0.6+idleDriftX+camAnimOffsetX;
const shakeY=walkBounce+breathOffset+(Math.random()-0.5)*totalShake*0.4+idleDriftY+camAnimOffsetY;
const shakeZ=(Math.random()-0.5)*totalShake*0.2+camAnimOffsetZ;
const displayY=isJumping?jumpY:camCurrentY;
camera.position.x=playerX+shakeX;camera.position.y=displayY+shakeY;camera.position.z=playerZ+shakeZ;
camera.rotation.y=camCurrentRotY+idleDriftX*0.3+camAnimRotYOffset;
camera.rotation.x=camCurrentRotX+idleDriftY*0.3+camAnimRotXOffset;
camera.rotation.z=(camTargetRotY-camCurrentRotY)*0.15+turnVelocity*0.1+idleDriftX*0.2+camAnimRotZOffset;
turnVelocity*=Math.exp(-dt*4);
}

function startDVFrameLoop(){
let lastFrameTime=performance.now();let accumulator=0;
function dvTick(){
if(!STATE.inGame&&!STATE.dead){requestAnimationFrame(dvTick);return;}
const now=performance.now();let rawDt=now-lastFrameTime;lastFrameTime=now;
if(rawDt>100)rawDt=100;accumulator+=rawDt;
while(accumulator>=FRAME_DURATION){const fixedDt=FRAME_DURATION/1000;processGameTick(fixedDt);accumulator-=FRAME_DURATION;}
renderDVFrame();requestAnimationFrame(dvTick);
}
dvTick();
}

let fc=0,lightUpdateCounter=0;
function processGameTick(dt){
if(STATE.dead)return;
fc++;
upPlayer(dt);
updateCameraState(dt);
updateFlashlight(dt);
updateAutoExposure(dt);
updateRadio(dt);
radioSpawnTimer+=dt;
if(radioSpawnTimer>=RADIO_SPAWN_INTERVAL){radioSpawnTimer=0;if(Math.random()<RADIO_SPAWN_CHANCE){trySpawnRadio(false);}}
lightUpdateCounter++;
if(lightUpdateCounter>=3){lightUpdateCounter=0;upLightsR0(dt*3);upLightsR1(dt*3);}
upRed(dt);upDark(dt);
checkExitWalls();updateExitWalls(dt);autoSpawnExits();
if(fc%120===0){loadAllMazes();spawnR1Lights();}
if(fc%60===0)updateAllLightDistances();
}

function renderDVFrame(){if(!renderer||!scene||!camera)return;renderer.render(scene,camera);}

function upPlayer(dt){
if(STATE.dead)return;
let mx=0,mz=0,dist=0,targetSpeed=0;
if(mTId!==null){const dx=mCX-mSX,dy=mCY-mSY;dist=Math.sqrt(dx*dx+dy*dy);if(dist>8){mx=dx/dist;mz=-dy/dist;}}
const run=dist>40&&!isCrouching&&(stamina>0||STATE.infStamina);
const walk=dist>8&&!run&&!isCrouching;
const cmv=isCrouching&&dist>8;const isCrouchMoving=isCrouching&&dist>8;
if(run&&!STATE.wasRunning){STATE.wasRunning=true;startRunAudio();}else if(!run&&STATE.wasRunning){STATE.wasRunning=false;stopRunAudio();}
upStamina(dt,run,walk,cmv,isCrouchMoving);
if(run&&stamina<=0&&!STATE.infStamina)targetSpeed=0.04;else if(run)targetSpeed=0.2;
else if(walk&&stamina<=0&&!STATE.infStamina)targetSpeed=0.025;else if(walk)targetSpeed=0.05;
else if(cmv&&stamina<=0&&!STATE.infStamina)targetSpeed=0.015;else if(cmv)targetSpeed=0.03;
else targetSpeed=0;
const accel=targetSpeed>playerCurrentSpeed?3.0:6.0;
playerCurrentSpeed+=(targetSpeed-playerCurrentSpeed)*Math.min(dt*accel,1);
if(playerCurrentSpeed<0.001)playerCurrentSpeed=0;
if(playerCurrentSpeed>0&&dist>8){
const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();
const rgt=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);rgt.y=0;rgt.normalize();
let fmx=mx,fmz=mz,cl=0;
if(redExp>8&&!STATE.godMode)cl=Math.min(0.6,(redExp-8)/30*0.6);
if(overdraft>50)cl=Math.max(cl,(overdraft-50)/50*0.7);
if(cl>0){const angle=(Math.random()-0.5)*cl*Math.PI/2;const cos=Math.cos(angle),sin=Math.sin(angle);fmx=mx*cos-mz*sin;fmz=mx*sin+mz*cos;}
const tx=playerX+(fwd.x*fmz+rgt.x*fmx)*playerCurrentSpeed,tz=playerZ+(fwd.z*fmz+rgt.z*fmx)*playerCurrentSpeed;
if(!col(tx,tz)){playerX=tx;playerZ=tz;}else{
if(!col(playerX+(fwd.x*fmz+rgt.x*fmx)*playerCurrentSpeed,playerZ))playerX+=(fwd.x*fmz+rgt.x*fmx)*playerCurrentSpeed;
if(!col(playerX,playerZ+(fwd.z*fmz+rgt.z*fmx)*playerCurrentSpeed))playerZ+=(fwd.z*fmz+rgt.z*fmx)*playerCurrentSpeed;
playerCurrentSpeed*=0.3;
}
if(run)camShakeAmount=Math.min(0.04,camShakeAmount+dt*0.15);
else if(cmv)camShakeAmount=Math.min(0.025,camShakeAmount+dt*0.08);
else camShakeAmount=Math.min(0.015,camShakeAmount+dt*0.04);
}
if(isJumping){playerVelY-=0.012*dt*60;jumpY+=playerVelY*dt*60;const groundY=(isCrouching?CH:NH)+getCurrentRegionY();if(jumpY<=groundY){jumpY=groundY;playerVelY=0;isJumping=false;camCurrentY=groundY;}if(stamina<=0&&!STATE.infStamina){overdraft+=(100/10)*dt;if(overdraft>=maxOverdraft){overdraftDeath();}}}
camera.position.x=playerX;camera.position.z=playerZ;
}
